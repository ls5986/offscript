<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Off Script - App Store header artwork</title>
  <style>
    @font-face { font-family: DM; src: url("../assets/fonts/DMSans-Medium.woff2"); font-weight: 500; }
    @font-face { font-family: DM; src: url("../assets/fonts/DMSans-Bold.woff2"); font-weight: 700; }
    @font-face { font-family: Fraunces; src: url("../assets/fonts/Fraunces-Regular.woff2"); }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; margin: 0; }
    body { background: #172B49; }
    .scene { width: 100%; height: 100%; position: relative; overflow: hidden; background: #172B49; color: #172B49; }
    .ambient { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 43%, #294461 0%, #172B49 64%); }
    .linework { position: absolute; inset: 0; width: 100%; height: 100%; }
    .sheet { position: absolute; border-radius: 100px; }
    .sheet.coral { background: #F29B87; box-shadow: 0 40px 80px #08172E30; }
    .sheet.lilac { background: #EAE5F4; box-shadow: 0 35px 60px #08172E30; }
    .front { position: absolute; filter: drop-shadow(0 45px 35px #08172E35); }
    .front svg { width: 100%; height: 100%; display: block; }
    .focal { position: absolute; display: flex; align-items: center; }
    .mark { width: 360px; height: 360px; flex-shrink: 0; display: block; }
    .copy { min-width: 0; }
    .brand { margin: 0 0 24px; color: #AA4234; font: 700 28px/1.3 DM, sans-serif; letter-spacing: 6px; }
    h1 { margin: 0; font: 400 146px/1.05 Fraunces, Georgia, serif; letter-spacing: -4px; }
    h1 span { display: block; white-space: nowrap; }
    .strap { margin: 30px 0 0; font: 500 35px/1.4 DM, sans-serif; }
    .wide .coral { width: 2130px; height: 950px; left: 820px; top: 350px; transform: rotate(-8deg); }
    .wide .lilac { width: 2070px; height: 1000px; left: 980px; top: 285px; transform: rotate(8deg); }
    .wide .front { width: 2190px; height: 1100px; left: 825px; top: 275px; transform: rotate(-2deg); }
    .wide .focal { left: 1182px; top: 540px; width: 1476px; height: 550px; gap: 84px; }
    .universal .coral { width: 2160px; height: 1640px; left: 1452px; top: 540px; transform: rotate(-8deg); border-radius: 130px; }
    .universal .lilac { width: 2110px; height: 1630px; left: 1665px; top: 440px; transform: rotate(9deg); border-radius: 130px; }
    .universal .front { width: 2200px; height: 1750px; left: 1522px; top: 420px; transform: rotate(-2deg); }
    .universal .focal { left: 1962px; top: 700px; width: 1320px; height: 850px; flex-direction: column; justify-content: center; text-align: center; }
    .universal .mark { width: 230px; height: 230px; margin-bottom: 22px; }
    .universal .brand { font-size: 32px; margin-bottom: 20px; }
    .universal h1 { font-size: 150px; line-height: 1.04; }
    .universal .strap { font-size: 38px; margin-top: 24px; }
    .safe-guide { display: none; position: absolute; border: 5px solid #00DB5A; z-index: 5; pointer-events: none; }
    .show-guides .safe-guide { display: block; }
    .safe-guide span { position: absolute; bottom: 100%; left: -5px; background: #00DB5A; color: #172B49; font: 700 23px/1.3 DM, sans-serif; padding: 9px 15px; letter-spacing: 1px; white-space: nowrap; }
    .wide .safe-guide { left: 1097px; top: 493px; width: 1646px; height: 661px; }
    .universal .safe-guide { left: 1921px; top: 660px; width: 1402px; height: 962px; }
  </style>
</head>
<body>
  <main class="scene wide" id="scene" aria-label="Off Script. Make it up. As you go. One phone. Everyone plays.">
    <div class="ambient"></div>
    <svg class="linework" viewBox="0 0 3840 1646" preserveAspectRatio="none" aria-hidden="true">
      <g fill="none" stroke="#39516D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-80 290C200 40 530 55 660 290S575 685 345 620 180 320 350 338 430 530 345 532" />
        <path d="M3190 1205C3370 958 3675 1040 3700 1240S3500 1560 3370 1430 3430 1220 3510 1290" />
        <path d="M3060 186h390v150h-130l-100 100v-100h-160Z" />
        <path d="M350 1160h280v120h-90l-75 75v-75h-115Z" />
      </g>
      <g fill="#F29B87">
        <rect x="650" y="210" width="80" height="80" rx="19" transform="rotate(15 690 250)" />
        <rect x="3170" y="790" width="125" height="125" rx="28" transform="rotate(-13 3232 852)" />
        <circle cx="860" cy="1410" r="20" />
        <circle cx="3010" cy="230" r="15" />
      </g>
      <g fill="#EAE5F4">
        <rect x="459" y="900" width="60" height="60" rx="16" transform="rotate(-11 489 930)" />
        <circle cx="3455" cy="660" r="18" />
      </g>
    </svg>
    <div class="sheet coral"></div>
    <div class="sheet lilac"></div>
    <div class="front" aria-hidden="true">
      <svg viewBox="0 0 2190 1100" preserveAspectRatio="none">
        <path d="M108 0H2082Q2190 0 2190 108V862Q2190 970 2082 970H550L350 1100V970H108Q0 970 0 862V108Q0 0 108 0Z" fill="#F8F6F1" />
        <path d="m1990 0 150 0 50 50v150Z" fill="#EAE5F4" />
      </svg>
    </div>
    <div class="focal">
      <img class="mark" src="../public/brand/mark.svg" alt="Off Script">
      <div class="copy">
        <p class="brand">OFF SCRIPT</p>
        <h1><span>Make it up.</span><span>As you go.</span></h1>
        <p class="strap">One phone. Everyone plays.</p>
      </div>
    </div>
    <div class="safe-guide"><span>PREVIEW ONLY / APPLE TEMPLATE ART SAFE AREA</span></div>
  </main>
  <script>
    const parameters = new URLSearchParams(location.search);
    const format = parameters.get("format") || "wide";
    if (!["wide", "universal"].includes(format)) throw new Error(`Unsupported header format: ${format}`);
    const scene = document.getElementById("scene");
    scene.className = `scene ${format}${parameters.get("guides") === "1" ? " show-guides" : ""}`;
    window.headerReady = (async () => {
      await document.querySelector(".mark").decode();
      await document.fonts.ready;
      if (!document.fonts.check("146px Fraunces") || !document.fonts.check("700 28px DM")) {
        throw new Error("A bundled header font failed to load.");
      }
    })();
  </script>
</body>
</html>
